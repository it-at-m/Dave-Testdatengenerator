# Workflow for building NPM/Maven projects and Docker images
name: build

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "only_csv"
      - "test_deploy"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TZ: Europe/Berlin
    strategy:
      fail-fast: false
      matrix:
        include: # Add or modify paths according to your project structure
          - app-path: backend
          - app-path: frontend

    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@4485daa4781dde13e7d9d5f4d8acbe33f993299c # v1.7.0
      - id: node # required for steps.* syntax
        if: ${{ hashFiles(format('./{0}/package.json', matrix.app-path)) != '' }}
        uses: it-at-m/lhm_actions/action-templates/actions/action-npm-build@4485daa4781dde13e7d9d5f4d8acbe33f993299c # v1.7.0
        with:
          app-path: ${{ matrix.app-path }}
          node-version: "22"
          run-lint: false # TODO remove this line and fix style issues
      - id: maven # required for steps.* syntax
        if: ${{ hashFiles(format('./{0}/pom.xml', matrix.app-path)) != '' }}
        uses: it-at-m/lhm_actions/action-templates/actions/action-maven-build@4485daa4781dde13e7d9d5f4d8acbe33f993299c # v1.7.0
        with:
          app-path: ${{ matrix.app-path }}
          java-version: "21"
      - if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test_deploy' || github.ref == 'refs/heads/only_csv') && (steps.node.outcome == 'success' || steps.maven.outcome == 'success') }}
        uses: it-at-m/lhm_actions/action-templates/actions/action-build-image@4485daa4781dde13e7d9d5f4d8acbe33f993299c # v1.7.0
        with:
          path: ${{ matrix.app-path }}
          image-name: ${{ matrix.app-path }}
          artifact-name: ${{ join(steps.*.outputs.artifact-name) }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          registry-username: ${{ github.actor }}
          image-tags: |
            type=raw,value=dev
