spring:
  main:
    banner-mode: console
  application:
    name: "@project.artifactId@"
    group: "@project.groupId@"
    version: "@project.version@"
  profiles:
    # Activating the "local" profile also activates "no-security" (inbound auth disabled for local dev).
    group:
      local: no-security
  web:
    error:
      whitelabel:
        enabled: false

# Connection to the DAVe backend that the generated counts are imported into.
# auth.mode: none   -> no Authorization header (use against a backend started with runLocalNoSecurity)
# auth.mode: oauth2 -> obtain a bearer token via OAuth2 client-credentials before each call
dave:
  backend:
    base-url: http://localhost:8080
    auth:
      mode: none
      token-uri: ""
      client-id: ""
      client-secret: ""
      scope: ""

# Config for spring actuator endpoints
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
          - sbom
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      access: read_only
    info:
      access: read_only
    prometheus:
      access: read_only
    sbom:
      access: read_only
  info:
    env:
      enabled: true
  otlp:
    metrics:
      export:
        enabled: false

springdoc:
  show-actuator: true
  # Disable swagger-ui as default
  swagger-ui:
    enabled: false
  api-docs:
    version: openapi_3_0
    enabled: false

logging:
  level:
    root: info
  structured:
    format:
      console: logstash
    json:
      stacktrace:
        root: first
        # default max size of one log line in docker is 16kb - UTF8 ~ 1 Character = 1 Byte
        # therefore limit stack traces to a maximum of 8192 characters (to leave room for the rest of the message)
        max-length: 8192
      add:
        application_name: ${spring.application.name}
        application_group: ${spring.application.group}

info:
  application:
    name: ${spring.application.name}
    version: ${spring.application.version}
    group: ${spring.application.group}
    description: "@project.description@"
  build:
    java.version: "@java.version@"
